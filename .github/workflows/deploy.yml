name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs finish rather than being killed,
# so a half-written deployment is not published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Reads .nvmrc, so CI and local can never drift apart.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Gates the build. Content that fails validation — a work missing alt text,
      # malformed dimensions — stops here rather than reaching the site.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          # Set PATH_PREFIX to "/<repo-name>/" for a project page. Leave as "/"
          # when a custom domain points at the site.
          PATH_PREFIX: ${{ vars.PATH_PREFIX || '/' }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: npx eleventy --config=eleventy.config.ts

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
